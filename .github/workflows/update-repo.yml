name: Update APT/RPM Repository Indexes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to process (e.g. v0.9.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Import GPG Signing Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --export 4A4F6A3BD1928E4A > debian/KEY.gpg
          echo "GPG key imported and exported as binary"

      - name: Fetch Latest Assets & Generate APT Directory Structure
        run: |
          mkdir -p debian/pool/main
          mkdir -p debian/dists/stable/main/binary-amd64

          RELEASE_TAG="${{ inputs.release_tag }}"
          REPO="${{ github.repository }}"

          # Remove old debs so dpkg-scanpackages picks only the latest
          rm -f debian/pool/main/*.deb

          # Fetch .deb from release assets using GitHub API
          DEB_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/releases/tags/$RELEASE_TAG" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(a['browser_download_url'])for a in d.get('assets',[])if a['name'].endswith('.deb')]")

          if [ -n "$DEB_URL" ]; then
            wget -q "$DEB_URL" -P debian/pool/main
            DEB_FILE=$(find debian/pool/main -maxdepth 1 -name '*.deb' 2>/dev/null | head -1)
          fi

          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "debian/pool/main/metaforge-${RELEASE_TAG}.deb"
            cd debian
            # Generate both uncompressed Packages and Packages.gz
            dpkg-scanpackages pool/main /dev/null > dists/stable/main/binary-amd64/Packages
            gzip -9c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
            cd dists/stable
            apt-ftparchive release . > Release
          else
            echo "No .deb found for release $RELEASE_TAG — skipping APT index update"
          fi

      - name: Sign Release File with GPG
        if: success()
        run: |
          cd debian/dists/stable
          rm -f InRelease Release.gpg
          gpg --batch --armor --detach-sign --output Release.gpg Release
          gpg --batch --armor --clearsign --output InRelease Release
          echo "Release file signed"

      - name: Commit & Push gh-pages updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update APT repository index for release ${{ inputs.release_tag }}"
            git push origin gh-pages
          fi
