name: Update APT/RPM Repository Indexes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name to process (e.g. v0.9.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Fetch Latest Assets & Generate APT Directory Structure
        run: |
          mkdir -p debian/pool/main
          mkdir -p debian/dists/stable/main/binary-amd64

          RELEASE_TAG="${{ inputs.release_tag }}"

          # Remove old debs so dpkg-scanpackages picks only the latest
          rm -f debian/pool/main/*.deb

          gh release download "$RELEASE_TAG" --pattern "*.deb" --dir debian/pool/main
          DEB_FILE=$(ls debian/pool/main/*.deb 2>/dev/null | head -1)

          if [ -n "$DEB_FILE" ]; then
            mv "$DEB_FILE" "debian/pool/main/metaforge-${RELEASE_TAG}.deb"
            cd debian
            dpkg-scanpackages pool/main /dev/null | gzip -9c > dists/stable/main/binary-amd64/Packages.gz
            cd dists/stable
            {
              echo "Origin: MoTekLab"
              echo "Label: MetaForge Stable"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Architectures: amd64"
              echo "Components: main"
              echo "Description: MoTekLab MetaForge APT repository"
            } > Release
            apt-ftparchive release . >> Release
          else
            echo "No .deb found for release $RELEASE_TAG — skipping APT index update"
          fi

      - name: Commit & Push gh-pages updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update APT repository index for release ${{ inputs.release_tag }}"
            git push origin gh-pages
          fi
