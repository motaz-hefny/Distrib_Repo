name: Update APT/RPM Repository Indexes

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Fetch Latest Assets & Generate APT Directory Structure
        run: |
          mkdir -p debian/pool/main
          mkdir -p debian/dists/stable/main/binary-amd64

          RELEASE_TAG=\"\${{ github.event.release.tag_name }}\"
          REPO=\"\${{ github.repository }}\"

          DEB_URL=\$(curl -s \"https://api.github.com/repos/\$REPO/releases/tags/\$RELEASE_TAG\" \\
            | python3 -c \"import sys,json; data=json.load(sys.stdin); \
              [print(a["\"browser_download_url\""]) for a in data.get("\"assets\"",[]) if a["\"name\""].endswith("\".deb\"")]\" \\
            | head -1)

          if [ -n \"\$DEB_URL\" ]; then
            wget -q \"\$DEB_URL\" -O debian/pool/main/metaforge-\$RELEASE_TAG.deb
            cd debian
            dpkg-scanpackages pool/main /dev/null | gzip -9c > dists/stable/main/binary-amd64/Packages.gz
            cd dists/stable
            {
              echo \"Origin: MoTekLab\"
              echo \"Label: MetaForge Stable\"
              echo \"Suite: stable\"
              echo \"Codename: stable\"
              echo \"Architectures: amd64\"
              echo \"Components: main\"
              echo \"Description: MoTekLab MetaForge APT repository\"
            } > Release
            apt-ftparchive release . >> Release
          else
            echo \"No .deb found for release \$RELEASE_TAG — skipping APT index update\"
          fi

      - name: Commit & Push gh-pages updates
        run: |
          git config --global user.name \"github-actions[bot]\"
          git config --global user.email \"github-actions[bot]@users.noreply.github.com\"
          git add -A
          if git diff --staged --quiet; then
            echo \"No changes to commit\"
          else
            git commit -m \"Update APT repository index for release \${{ github.event.release.tag_name }}\"
            git push origin gh-pages
          fi
